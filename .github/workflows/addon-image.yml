name: Add-on Image

on:
  pull_request:
    paths:
      - ".github/workflows/addon-image.yml"
      - "addons/ha-gatekeeper/**"
      - "package.json"
      - "package-lock.json"
      - "packages/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/addon-image.yml"
      - "addons/ha-gatekeeper/**"
      - "package.json"
      - "package-lock.json"
      - "packages/**"

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/wookingwoo/ha-gatekeeper
  ADDON_VERSION: 0.1.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish add-on image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: addons/ha-gatekeeper/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          build-args: |
            BUILD_VERSION=${{ env.ADDON_VERSION }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.ADDON_VERSION }}
            ${{ env.IMAGE_NAME }}:latest
