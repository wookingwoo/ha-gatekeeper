name: Add-on Image

on:
  pull_request:
    paths:
      - ".github/workflows/addon-image.yml"
      - "addons/ha-gatekeeper/**"
      - "package.json"
      - "package-lock.json"
      - "packages/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/addon-image.yml"
      - "addons/ha-gatekeeper/**"
      - "package.json"
      - "package-lock.json"
      - "packages/**"

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/wookingwoo/ha-gatekeeper

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "file:${{ github.workspace }}/ci.db"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Build
        run: npm run build

      - name: Run server unit tests
        run: npm run test -w packages/server

      - name: Run web unit tests
        run: npm run test -w packages/web

      - name: Run MCP unit tests
        run: npm run test:mcp

      - name: Apply database migrations for e2e
        run: npx prisma migrate deploy --schema packages/server/prisma/schema.prisma

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run e2e tests
        run: npm run e2e
        env:
          HA_BASE_URL: "http://127.0.0.1:1"
          HA_TOKEN: "ci-fake-ha-token"
          ADMIN_PASSWORD: "change-this-password"
          ADMIN_SESSION_SECRET: "ci-session-secret-32-bytes-minimum!"
          API_KEY_HASH_SECRET: "ci-api-key-hash-secret"

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read addon version
        id: version
        run: |
          echo "value=$(grep -m1 '^version:' addons/ha-gatekeeper/config.yaml | sed -E 's/version: *"?([^"]*)"?/\1/')" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish add-on image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: addons/ha-gatekeeper/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          build-args: |
            BUILD_VERSION=${{ steps.version.outputs.value }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.value }}
            ${{ env.IMAGE_NAME }}:latest
