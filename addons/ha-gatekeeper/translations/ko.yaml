configuration:
  expose_api:
    name: 내부망 API 활성화
    description: 매핑한 내부망 포트에서 직접 API를 호출하도록 허용합니다. Cloudflare 터널 연결에는 필요하지 않습니다.
  log_level:
    name: 로그 수준
  cloudflare_tunnel_enabled:
    name: Cloudflare 터널 활성화
    description: 내장 터널을 실행합니다. Cloudflare의 서비스 URL을 http://127.0.0.1:8081로 설정하세요.
  cloudflare_tunnel_token:
    name: Cloudflare 터널 토큰
    description: 생성한 터널의 커넥터 토큰입니다. Cloudflare API 키나 Gatekeeper 토큰과 다릅니다. 외부에 공유하지 마세요.
  cloudflare_public_url:
    name: Gatekeeper 공개 주소
    description: https://gatekeeper.example.com 같은 HTTPS 주소를 입력하세요. 에이전트 설정 ZIP에 반영됩니다.
