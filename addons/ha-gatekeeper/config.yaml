name: HA Gatekeeper
version: "0.3.0"
slug: ha_gatekeeper
description: Scoped, audited Gatekeeper tokens for Home Assistant service access.
url: https://github.com/wookingwoo/ha-gatekeeper
image: ghcr.io/wookingwoo/ha-gatekeeper
arch:
  - aarch64
  - amd64
startup: application
boot: auto
stage: stable
init: false
ingress: true
ingress_port: 8080
panel_icon: mdi:shield-key
panel_title: HA Gatekeeper
homeassistant_api: true
ports:
  8080/tcp: 4283
ports_description:
  8080/tcp: Optional LAN agent API
options:
  expose_api: false
  log_level: info
  public_api_ip_rate_limit: 300
  ha_request_timeout_seconds: 30
  cloudflare_tunnel_enabled: false
  cloudflare_public_url: ""
schema:
  public_api_ip_rate_limit: "int(1,2147483647)"
  ha_request_timeout_seconds: "int(1,600)"
  expose_api: bool
  log_level: "list(trace|debug|info|warn|error|fatal)"
  cloudflare_tunnel_enabled: bool
  cloudflare_tunnel_token: "password?"
  cloudflare_public_url: str
